# Spacelift — SBOM diff as a before_apply hook.
# Copy into .spacelift/config.yml at the root of the stack's repository.
#
# The natural fit is a stack that ships a container: the plan has resolved which
# image tag is about to go live, and nothing has been created yet. A hook
# command exiting non-zero fails the run before apply.
version: "1"

stack_defaults:
  # The default runner image has neither Python nor syft.
  runner_image: python:3.13-slim
  environment:
    IMAGE_REPO: registry.example.com/myapp
    DEPLOYED_TAG: production
    SYFT_VERSION: v1.18.1

stacks:
  # Replace with your stack's ID (the slug in its Spacelift URL).
  production-workloads:
    before_apply:
      - pip install --no-cache-dir --quiet "git+https://github.com/fabiocicerchia/sbom-diff@v1.0.1"
      - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin "$SYFT_VERSION"
      # CANDIDATE_TAG comes from the run — a Spacelift environment variable, a
      # context, or terraform output. Anything that names the image going live.
      - syft -q -o cyclonedx-json "registry:$IMAGE_REPO:$DEPLOYED_TAG" > /tmp/base.json
      - syft -q -o cyclonedx-json "registry:$IMAGE_REPO:$CANDIDATE_TAG" > /tmp/head.json
      # Every gate is opt-in — drop the flags to report without ever failing.
      - sbom-diff /tmp/base.json /tmp/head.json --fail-on major --fail-on-license-change
