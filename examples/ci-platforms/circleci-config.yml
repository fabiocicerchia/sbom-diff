# CircleCI — SBOM diff between the branch and its base.
# Copy into .circleci/config.yml.
#
# The job image is the published sbom-diff image; git and syft are added on top.
version: 2.1

jobs:
  sbom-diff:
    docker:
      - image: ghcr.io/fabiocicerchia/sbom-diff:1.0.1
        # The image's entrypoint is sbom-diff itself; steps need a shell.
        entrypoint: ["/bin/sh"]
        user: root
    environment:
      SYFT_VERSION: v1.18.1
      # CircleCI exposes no base ref of its own; name the branch you merge into.
      BASE_BRANCH: main
    steps:
      - run:
          name: Add git and syft
          command: |
            apk add --no-cache git curl openssh-client
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
              | sh -s -- -b /usr/local/bin "$SYFT_VERSION"
      - checkout
      - run:
          name: Scan both sides
          command: |
            syft -q -o cyclonedx-json=head.json dir:.
            git fetch --no-tags origin "$BASE_BRANCH"
            git worktree add /tmp/base "origin/$BASE_BRANCH"
            syft -q -o cyclonedx-json=base.json dir:/tmp/base
      - run:
          name: Diff
          command: |
            set -o pipefail  # the gate's exit code has to survive the pipe
            # Every gate is opt-in — drop the flags to report without failing.
            sbom-diff base.json head.json --fail-on major --max-added-transitive 10 \
              | tee /tmp/sbom-diff.md
      - store_artifacts:
          path: /tmp/sbom-diff.md

workflows:
  pull-request:
    jobs:
      - sbom-diff
