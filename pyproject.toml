[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbom-diff"
version = "1.1.1"
description = "Diff two SBOMs and explain dependency changes in plain language"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/sbom-diff"
Issues = "https://github.com/fabiocicerchia/sbom-diff/issues"
Changelog = "https://github.com/fabiocicerchia/sbom-diff/blob/main/CHANGELOG.md"

[project.scripts]
sbom-diff = "sbom_diff:main"

[tool.setuptools]
py-modules = ["sbom_diff"]
packages = ["sbom_diff_lib"]

# Import sbom_diff from the checkout, not from whatever copy happens to be in
# site-packages. Without this, `pytest` (the console script, which does not put
# the rootdir on sys.path) tests an installed wheel instead of this tree.
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

# Keep black (used by some external checkers) in sync with ruff's line length.
[tool.black]
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# `assert` is what a test is, and an expected value is the literal it compares
# against -- naming it moves the assertion one step from the thing asserted.
"tests/**" = [
  "S101",     # `assert` is what a test is
  "PLR2004",  # an expected value is the literal it compares against
  "ANN001",   # a fixture or a fake's argument, named by the test that builds it
]
