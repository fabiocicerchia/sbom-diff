version: 2
updates:
  # Keep GitHub Actions pinned SHAs fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # wait a week before proposing brand-new versions

  # Python dependencies (pyproject.toml).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
