# Backstage catalog entry, read by paved's scorecard plugin.
#
# Every check paved scores is derived from this file alone — no cluster
# access, no CI credentials. What is absent here is absent from the score.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: sbom-diff
  description: >-
      Diffs two SBOMs (CycloneDX/SPDX) and highlights added, removed, and version-changed components.
      Useful as a supply-chain change review step in CI.
  annotations:
    github.com/project-slug: fabiocicerchia/sbom-diff
    backstage.io/source-location: url:https://github.com/fabiocicerchia/sbom-diff/
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/fabiocicerchia/sbom-diff
      title: Source
spec:
  type: library
  lifecycle: production
  owner: group:default/kodebeat
  system: oss-tools
