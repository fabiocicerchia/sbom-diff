name: 'sbom-diff'
description: 'Diff two SBOMs and post the result as a PR comment'
author: 'Fabio Cicerchia'
branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  old-sbom:
    description: 'Path to the previous SBOM (CycloneDX or SPDX JSON)'
    required: true
  new-sbom:
    description: 'Path to the current SBOM'
    required: true
  fail-on:
    description: 'Exit non-zero on: any change / major bumps / license changes'
    required: false
    default: ''
  github-token:
    description: 'Token used to post/update the PR comment'
    required: false
    default: ${{ github.token }}

outputs:
  summary:
    description: 'One-line summary of the diff'
    value: ${{ steps.diff.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install sbom-diff
      shell: bash
      run: pip install "${{ github.action_path }}"

    - name: Run sbom-diff
      id: diff
      shell: bash
      env:
        # Passed through env vars, not interpolated into the script — these
        # are caller-supplied action inputs, and raw ${{ }} interpolation
        # into a run: block is a shell-injection vector.
        OLD_SBOM: ${{ inputs.old-sbom }}
        NEW_SBOM: ${{ inputs.new-sbom }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set +e
        args=("$OLD_SBOM" "$NEW_SBOM")
        if [ -n "$FAIL_ON" ]; then
          args+=(--fail-on "$FAIL_ON")
        fi
        sbom-diff "${args[@]}" | tee sbom-diff-output.md
        exit_code="${PIPESTATUS[0]}"
        summary="$(sed -n '3p' sbom-diff-output.md)"
        {
          echo "summary=$summary"
          echo "exit_code=$exit_code"
        } >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ github.repository }}" \
          --edit-last --create-if-none \
          --body-file sbom-diff-output.md

    - name: Fail if sbom-diff's gate tripped
      if: steps.diff.outputs.exit_code != '0'
      shell: bash
      run: exit 1
